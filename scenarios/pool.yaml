scenario:
  name: pool
  title: "Aquatic distress (swimming pool)"
  entity_word: Swimmer
  unit_word: body-heights

  behavior_names:
    aquatic_distress: "High-risk aquatic distress"
    submersion: "Possible submersion"


model:
  # Using the currently available YOLO11s model.
  # COCO class 0 = person.
  weights: yolo11s.pt
  classes: [0]


video:
  # Process every frame for better tracking in low-quality videos.
  frame_stride: 1


pool:
  enabled: true


behaviors:
  loitering:
    enabled: false

  approaching:
    enabled: false

  crowding:
    enabled: false

  aquatic_distress:
    enabled: true

  submersion:
    enabled: true


chains:
  enabled: true
  max_gap_s: 30.0


announce:
  min_risk: 0.7